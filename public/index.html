<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="AirBoard Pro — lousa digital colaborativa em tempo real. PC/TV + celular via QR Code.">
  <title>AirBoard Pro • Lousa Digital Colaborativa</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">✦</div>
      <div>AirBoard Pro<small>LOUSA DIGITAL COLABORATIVA</small></div>
    </div>
    <div class="actions">
      <span class="pill" id="roomPill" title="Código da sala">Sala ------</span>
      <button class="btn secondary" id="present" title="Tela cheia (F)">⛶ Apresentar</button>
      <button class="btn" id="connect" title="Mostrar QR Code (Q)">⌁ Conectar</button>
      <button class="btn primary" id="save" title="Salvar PNG (Ctrl+S)">↓ Salvar</button>
    </div>
  </header>

  <main class="workspace">
    <canvas id="board" class="board"></canvas>

    <div class="status" id="statusBox">
      <span class="dot" id="netDot"></span>
      <span id="status">Conectando…</span>
      <span class="users" id="users" title="Participantes"></span>
    </div>

    <nav class="side" aria-label="Ferramentas">
      <button class="tool active" data-tool="pen"        title="Caneta (P)" aria-label="Caneta">✎</button>
      <button class="tool"        data-tool="highlighter" title="Marca-texto (H)" aria-label="Marca-texto">▰</button>
      <button class="tool"        data-tool="eraser"      title="Borracha (E)" aria-label="Borracha">⌫</button>
      <div class="sep"></div>
      <button class="tool" data-tool="line"   title="Linha (L)" aria-label="Linha">╱</button>
      <button class="tool" data-tool="arrow"  title="Seta (A)" aria-label="Seta">➤</button>
      <button class="tool" data-tool="rect"   title="Retângulo (R)" aria-label="Retângulo">□</button>
      <button class="tool" data-tool="circle" title="Círculo (C)" aria-label="Círculo">○</button>
      <button class="tool" data-tool="text"   title="Texto (T)" aria-label="Texto">T</button>
      <div class="sep"></div>
      <button class="tool" data-tool="laser" title="Ponteiro laser (V)" aria-label="Laser">⌖</button>
      <div class="sep"></div>
      <button class="tool" id="undoBtn" title="Desfazer (Ctrl+Z)" aria-label="Desfazer">↶</button>
    </nav>

    <div class="bottom">
      <div class="swatches" id="swatches" aria-label="Cores"></div>
      <input class="color" id="color" type="color" value="#111827" title="Cor personalizada">
      <label class="sizeWrap" title="Espessura">
        <span id="sizePreview" class="sizeDot"></span>
        <input class="range" id="size" type="range" min="1" max="30" value="4">
      </label>
      <button class="btn danger" id="clear" title="Limpar quadro">🗑 Limpar</button>
    </div>

    <div class="overlay" id="modal" role="dialog" aria-modal="true">
      <div class="modal">
        <h2>Conectar celular / tablet</h2>
        <p>Escaneie o QR Code para desenhar junto. PC/TV e celular precisam estar na mesma rede Wi‑Fi.</p>
        <img id="qr" class="qr" alt="QR Code da sala">
        <div class="code" id="roomCode">------</div>
        <p id="network" class="mono"></p>
        <button class="btn close" id="close">Fechar</button>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/socket.io/socket.io.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
